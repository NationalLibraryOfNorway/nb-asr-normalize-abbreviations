[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nb-asr-normalize-abbreviations"
version = "0.1.0"
description = "Normalize Norwegian ASR JSONL text by expanding prose abbreviations and canonicalizing numeric units."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["tqdm>=4.64"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
clean-asr-jsonl = "clean_asr_jsonl:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["clean_asr_jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
